# Voxel grid configuration for early toy experiments

coordinate_frame: ego

# Meaning:
# x direction = forward
# y direction = left/right
# z direction = height

# Physical bounds in meters around the ego vehicle
x_min: 0.0
x_max: 10.0

y_min: -5.0
y_max: 5.0

z_min: 0.0
z_max: 3.0

# Size of edge of a voxel cube in meters
voxel_size: 1.0